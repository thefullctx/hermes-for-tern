[project]
name = "hermes-for-tern"
dynamic = ["version"]
description = "A native Tern frontend for Hermes Agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pillow>=12,<13",
    "tern-sdk==0.1.0",
    "websockets>=15,<17",
]

[project.scripts]
hermes-for-tern = "hermes_for_tern.launcher:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.15,<0.16"]

[tool.uv.sources]
tern-sdk = { git = "https://github.com/stencil-hq/tern-sdk", rev = "46bd7df153d3135d84a0b5658dfb4705d0bddb81", subdirectory = "python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_for_tern"]

[tool.hatch.version]
path = "src/hermes_for_tern/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
